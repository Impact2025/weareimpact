<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="315" r="120" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="315" r="80" fill="url(#accent)" opacity="0.15"/>
  <text x="80" y="260" font-family="sans-serif" font-size="48" font-weight="800" fill="#f8fafc">De eerlijke</text>
  <text x="80" y="310" font-family="sans-serif" font-size="48" font-weight="800" fill="#f8fafc">taakverdeling</text>
  <text x="80" y="360" font-family="sans-serif" font-size="48" font-weight="800" fill="#f8fafc">tussen mens &amp; <tspan fill="#f97316">machine</tspan></text>
  <text x="80" y="420" font-family="sans-serif" font-size="22" fill="#94a3b8">Hoe Iris mij uren werk bespaart</text>
  <line x1="80" y1="448" x2="280" y2="448" stroke="url(#accent)" stroke-width="4"/>
  <text x="80" y="490" font-family="sans-serif" font-size="16" fill="#64748b">WeAreImpact.nl — Vincent van Munster</text>
  <circle cx="1050" cy="250" r="90" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="90;95;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="1050" y="265" text-anchor="middle" font-family="sans-serif" font-size="90" fill="#f97316" opacity="0.6">AI</text>
</svg>
